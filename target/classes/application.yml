spring:
  ai:
    mcp:
      server:
        transport: SSE
        name: mcp-adapter
        version: 1.0.0
      servlet:
        path: /mcp

server:
  port: 8124

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 兜底 单机服务的连接信息
service:
  original:
    url: http://127.0.0.1:9020
    connect-timeout: 5000       # 连接超时（毫秒）
    read-timeout: 30000         # 读取超时（毫秒）
    # 认证配置（按需取消注释）
    # auth:
    #   enabled: true
    #   type: bearer     # basic | bearer
    #   username:
    #   password:
    #   token: your-token

  # 标准报文格式（金融类系统固定 JSON 报文模板）
  # 每个接口可单独在 template-dir 下创建 *.json 模板，按 URL 路径匹配
  message-format:
    enabled: true
    template-dir: templates               # 存放各接口报文模板的目录
    # 以下 sys-head / app-head 为兜底配置（当 per-API 模板不存在时使用）
    sys-head:
      branchId: "351002"
      userId: QQ
      userLang: CHINESE
      moduleId: CL
      sceneId: "01"
      sourceType: MT
      authFlag: N
    app-head:
      currentNum: "0"
      pageEnd: "0"
      pageStart: "0"
      pgupOrPgdn: "0"
      totalNum: "-1"

  # Nacos 服务发现
  nacos:
    enabled: true
    server-addr: http://10.7.30.30:8848/nacos
    namespace: online-batch_dev
    group: online-batch-dev

    # 服务过滤
    filter:
      enabled: true
      include-patterns:
        - ENSEMBLE-RB-*
        - ENSEMBLE-OB-*
      exclude-patterns: [ ]

    # 定时刷新（秒，0=不刷新）
    refresh-interval: 300

  # Comet API 集成在微服务自身主机端口上，无需独立配置

  # 接口白名单过滤 — 只注册匹配的接口为 MCP 工具，减少无关接口干扰 LLM 选择
  # 格式：逗号分隔的 Ant 路径模式，如 "/rb/nfin/interest/**,/ob/inq/system/branch/user"
  interface:
    filter:
      include-paths: /rb/nfin/interest/**,/ob/inq/system/branch/user
      exclude-paths: ""
