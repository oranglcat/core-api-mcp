spring:
  ai:
    mcp:
      server:
        transport: SSE
        name: mcp-adapter
        version: 1.0.0
      servlet:
        path: /mcp

server:
  port: 8124

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 兜底 单机服务的连接信息
service:
  original:
    url: http://127.0.0.1:9020
    connect-timeout: 5000       # 连接超时（毫秒）
    read-timeout: 30000         # 读取超时（毫秒）
    # 认证配置（按需取消注释）
    # auth:
    #   enabled: true
    #   type: bearer     # basic | bearer
    #   username:
    #   password:
    #   token: your-token

  # 标准报文格式（金融类系统固定 JSON 报文模板）
  # 每个接口可单独在 template-dir 下创建 *.json 模板，按 URL 路径匹配
  message-format:
    enabled: true
    template-dir: ./templates               # 存放各接口报文模板的目录
    # 以下 sys-head / app-head 为兜底配置（当 per-API 模板不存在时使用）
    sys-head:
      branchId: "351002"
      userId: QQ
      userLang: CHINESE
      moduleId: CL
      sceneId: "01"
      sourceType: MT
      authFlag: N
    app-head:
      currentNum: "0"
      pageEnd: "0"
      pageStart: "0"
      pgupOrPgdn: "0"
      totalNum: "-1"

  # Nacos 服务发现
  nacos:
    enabled: true
    server-addr: http://192.168.161.214:8848/nacos
    namespace: online-batch_uat
    group: online-batch-uat

    # Comet 平台（所有服务共用同一个 Comet 主机，端口按服务名映射）
    comet-host: 10.127.7.140

    # Comet 端口映射表（按服务名 Ant 模式匹配，未匹配使用 default-comet-port）
    comet-ports:
      "ENSEMBLE-RB-*": 9040
      "ENSEMBLE-OB-*": 9020

    # 服务过滤
    filter:
      enabled: true
      include-patterns:
        - ENSEMBLE-RB-*
        - ENSEMBLE-OB-*
      exclude-patterns: [ ]

    # 定时刷新（秒，0=不刷新）
    refresh-interval: 300

  # Comet 平台配置（单服务模式 / 默认兜底）
  # 当 Nacos 未启用或无可用服务时使用此地址
  comet:
    enabled: true
    base-url: http://10.127.7.141:9020  # ← Comet 平台地址
    timeout: 5000
